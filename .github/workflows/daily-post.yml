name: Sin & Sonnet daily post

on:
  schedule:
    # Two windows a day. An item's "slot" in queue.json decides which one it uses;
    # no slot means evening, so older entries behave exactly as before.
    # GitHub runs on UTC, so each window has lines for winter (EST) and summer (EDT),
    # and later wake-ups retry if GitHub started a run late.
    #
    # Evening, about 7:15pm Eastern — the daily main post (posts 7pm-10:59pm).
    - cron: "15 23 * * *"
    - cron: "15 0 * * *"
    - cron: "15 1 * * *"
    - cron: "15 2 * * *"
    - cron: "15 3 * * *"
    # Midday, about 12:15pm Eastern — the book-talk posts (posts 12pm-2:59pm).
    - cron: "15 16 * * *"
    - cron: "15 17 * * *"
    - cron: "15 18 * * *"
    - cron: "15 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test the key only (posts nothing). force = post the next approved item now."
        type: choice
        options: [check, force]
        default: check

permissions:
  contents: write

concurrency:
  group: sinandsonnet-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post to Instagram and Facebook
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python post.py "${{ github.event.inputs.mode || 'post' }}"

      - name: Save the line-up and log
        if: always()
        run: |
          git config user.name "Sin & Sonnet Poster"
          git config user.email "actions@users.noreply.github.com"
          git add queue.json posted-log.md
          git diff --cached --quiet || (git commit -m "Posted to Instagram/Facebook" && git push)
